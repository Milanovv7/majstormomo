<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majstor MOMO</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./Majstor_MOMO.png">
    <style>
        /* CSS Variables for Light / Dark / System Theme */
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body.dark-theme {
            --bg-color: #121212;
            --text-color: #ffffff;
            --glass-bg: rgba(18, 18, 18, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body.light-theme {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            body:not(.light-theme):not(.dark-theme) {
                --bg-color: #121212;
                --text-color: #ffffff;
                --glass-bg: rgba(18, 18, 18, 0.85);
                --border-color: rgba(255, 255, 255, 0.1);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Top Bar Container */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            max-height: 70px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Smooth Expansion when Open */
        .navbar.active {
            max-height: 480px;
        }

        .nav-header {
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            width: 100%;
        }

        .logo {
            height: 50px;
            width: auto;
            object-fit: contain;
            cursor: pointer;
            user-select: none;
        }

        /* Hamburger Menu (2 lines morphing into X) */
        .hamburger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 30px;
            height: 30px;
            z-index: 1001;
        }

        .line1, .line2 {
            width: 25px;
            height: 2px;
            background-color: var(--text-color);
            margin: 4px 0;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hamburger.active .line1 {
            transform: translateY(5px) rotate(45deg);
        }

        .hamburger.active .line2 {
            transform: translateY(-5px) rotate(-45deg);
        }

        /* Animated Inner Menu Content */
        .nav-content {
            padding: 10px 25px 25px 25px;
            display: flex;
            flex-direction: column;
        }

        .nav-item {
            color: var(--text-color);
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Staggered Fade-In when Menu Opens */
        .navbar.active .nav-item {
            opacity: 1;
            transform: translateY(0);
        }

        .navbar.active .nav-item:nth-child(1) { transition-delay: 0.08s; }
        .navbar.active .nav-item:nth-child(2) { transition-delay: 0.12s; }
        .navbar.active .nav-item:nth-child(3) { transition-delay: 0.16s; }
        .navbar.active .nav-item:nth-child(4) { transition-delay: 0.20s; }
        .navbar.active .nav-item:nth-child(5) { transition-delay: 0.24s; }

        /* Language Submenu */
        .lang-options {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding-left: 15px;
        }

        .lang-options.active {
            max-height: 100px;
        }

        .lang-options div {
            padding: 8px 0;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-color);
            opacity: 0.8;
        }

        .lang-options div:hover {
            opacity: 1;
        }

        /* Theme Toggle Controls */
        .theme-toggle-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            padding-top: 15px;
            border-bottom: none;
        }

        .theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            transition: background 0.2s, border-color 0.2s;
        }

        .theme-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .theme-btn.active {
            background: var(--text-color);
            color: var(--bg-color);
            border-color: var(--text-color);
        }

        /* Hero Section */
        .hero {
            margin-top: 70px;
            padding: 40px 20px;
            text-align: center;
        }

        .hero img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .hero h1 {
            margin-top: 25px;
            font-size: 24px;
            font-weight: 500;
        }

        /* Slideshow Section with Touch Support */
        .slideshow-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 40px auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            touch-action: pan-y;
        }

        .slides-container {
            display: flex;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
            user-select: none;
        }

        .slide {
            min-width: 100%;
            box-sizing: border-box;
        }

        .slide img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            pointer-events: none;
        }

        /* Bottom Fixed Slider Controls */
        .slider-controls {
            position: fixed;
            bottom: -80px; 
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            padding: 10px 25px;
            border-radius: 30px;
            display: flex;
            gap: 40px;
            z-index: 998;
            transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .slider-controls.visible {
            bottom: 30px;
        }

        .slider-controls button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.2s;
        }

        .slider-controls button:active {
            transform: scale(0.9);
        }

        /* Bottom Social Links & Action Buttons */
        .social-bottom {
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .social-bottom a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 18px;
            border: 1px solid var(--text-color);
            padding: 10px 30px;
            border-radius: 25px;
            width: 250px;
            transition: background 0.3s, color 0.3s;
        }

        .social-bottom a.call-btn {
            background: var(--text-color);
            color: var(--bg-color);
            font-weight: 600;
        }

        .social-bottom a:hover {
            opacity: 0.85;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .hero h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- Top Bar Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-header">
            <img src="./Majstor_MOMO.png" alt="Majstor MOMO Logo" class="logo" onclick="window.location.reload();">
            <div class="hamburger" id="hamburger" onclick="toggleMenu()">
                <div class="line1"></div>
                <div class="line2"></div>
            </div>
        </div>

        <div class="nav-content">
            <div class="nav-item lang-container">
                <div class="lang-toggle" onclick="toggleLang()" id="langLabel" data-key="langLabel">Јазик ▾</div>
                <div class="lang-options" id="langOptions">
                    <div onclick="setLang('mk')" data-key="macedonian">Македонски</div>
                    <div onclick="setLang('en')" data-key="english">English</div>
                </div>
            </div>
            <a href="tel:071267392" class="nav-item" data-key="call">Повикај: +389 71 267 392</a>
            <a href="https://www.facebook.com/majstor.momo" target="_blank" class="nav-item" data-key="facebook">Facebook</a>
            <a href="https://www.instagram.com/majstor.momo/" target="_blank" class="nav-item" data-key="instagram">Instagram</a>
            
            <!-- Theme Mode Controls -->
            <div class="nav-item theme-toggle-wrapper">
                <button class="theme-btn" id="btnThemeSystem" onclick="setTheme('system')" title="System Theme">
                    <!-- Computer Icon -->
                    <svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 5h16v11H4V5z"/></svg>
                </button>
                <button class="theme-btn" id="btnThemeLight" onclick="setTheme('light')" title="Light Mode">
                    <!-- Sun Icon -->
                    <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
                </button>
                <button class="theme-btn" id="btnThemeDark" onclick="setTheme('dark')" title="Dark Mode">
                    <!-- Moon Icon -->
                    <svg viewBox="0 0 24 24"><path d="M12.3 2c.43 0 .85.03 1.27.08-1.57.98-2.62 2.73-2.62 4.73 0 3.04 2.47 5.5 5.5 5.5 2 0 3.75-1.05 4.73-2.62.05.42.08.84.08 1.27 0 5.52-4.48 10-10 10S1.27 16.48 1.27 10.96 5.75 2 12.3 2z"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <!-- Hero Section -->
        <section class="hero">
            <img src="./650384957_122137742456990903_8666413726209295700_n.png" alt="МАЈСТОР МОМО">
            <h1 data-key="welcome">Добредојдовте кај Мајстор МОМО! Откријте повеќе сега.</h1>
        </section>

        <!-- Slideshow Section -->
        <section class="slideshow-wrapper" id="slideshowSection">
            <div class="slides-container" id="slidesContainer">
                <div class="slide"><img src="./748527858_122151549044990903_6627708820260192881_n.png" alt="Slide 1"></div>
                <div class="slide"><img src="./728427427_122149814618990903_459510204965844841_n.png" alt="Slide 2"></div>
                <div class="slide"><img src="./729375832_122149728146990903_7126979302070628647_n.png" alt="Slide 3"></div>
                <div class="slide"><img src="./728325646_122149553780990903_1360434851943652120_n.png" alt="Slide 4"></div>
                <div class="slide"><img src="./726645514_122149298462990903_5256951602720334585_n.png" alt="Slide 5"></div>
                <div class="slide"><img src="./726495291_122149139018990903_742751391020013363_n.png" alt="Slide 6"></div>
                <div class="slide"><img src="./724424976_122148973760990903_8986834090366905422_n.png" alt="Slide 7"></div>
                <div class="slide"><img src="./722305195_122148545264990903_7157427341935603887_n.png" alt="Slide 8"></div>
            </div>
        </section>

        <!-- Bottom Social Section -->
        <section class="social-bottom">
            <a href="tel:071267392" class="call-btn" data-key="call">Повикај: +389 71 267 392</a>
            <a href="https://www.facebook.com/majstor.momo" target="_blank" data-key="facebook">Facebook</a>
            <a href="https://www.instagram.com/majstor.momo/" target="_blank" data-key="instagram">Instagram</a>
        </section>
    </main>

    <!-- Footer -->
    <footer id="footer" data-key="footerText">
        ©2026 Мајстор МОМО Пехчево | Изработено со љубов од MilanovvDEV
    </footer>

    <!-- Fixed Slider Controls -->
    <div class="slider-controls" id="sliderControls">
        <button onclick="userChangeSlide(-1)">&#10094;</button>
        <button onclick="userChangeSlide(1)">&#10095;</button>
    </div>

    <!-- Scripts -->
    <script>
        const hamburger = document.getElementById('hamburger');
        const navbar = document.getElementById('navbar');
        const langOptions = document.getElementById('langOptions');

        function toggleMenu() {
            const isOpen = navbar.classList.contains('active');

            if (isOpen) {
                hamburger.classList.remove('active');
                navbar.classList.remove('active');
                langOptions.classList.remove('active');
                navbar.style.maxHeight = '';
            } else {
                hamburger.classList.add('active');
                navbar.classList.add('active');
            }
        }

        function toggleLang() {
            langOptions.classList.toggle('active');
            
            if (langOptions.classList.contains('active')) {
                navbar.style.maxHeight = '550px';
            } else {
                navbar.style.maxHeight = '480px';
            }
        }

        document.addEventListener('click', (event) => {
            const isClickInsideNavbar = navbar.contains(event.target);

            if (!isClickInsideNavbar && navbar.classList.contains('active')) {
                hamburger.classList.remove('active');
                navbar.classList.remove('active');
                langOptions.classList.remove('active');
                navbar.style.maxHeight = '';
            }
        });

        /* Translations System */
        const translations = {
            en: {
                langLabel: "Language ▾",
                english: "English",
                macedonian: "Macedonian",
                welcome: "Welcome to Majstor MOMO! Discover more now.",
                call: "Call: +389 71 267 392",
                facebook: "Facebook",
                instagram: "Instagram",
                footerText: "©2026 Majstor MOMO Pehcevo | Made with love by MilanovvDEV"
            },
            mk: {
                langLabel: "Јазик ▾",
                english: "Англиски",
                macedonian: "Македонски",
                welcome: "Добредојдовте кај Мајстор МОМО! Откријте повеќе сега.",
                call: "Повикај: +389 71 267 392",
                facebook: "Facebook",
                instagram: "Instagram",
                footerText: "©2026 Мајстор МОМО Пехчево | Изработено со љубов од MilanovvDEV"
            }
        };

        function setLang(lang) {
            localStorage.setItem('majstor_momo_lang', lang);
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (translations[lang] && translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
            langOptions.classList.remove('active');
            navbar.style.maxHeight = '';
            
            if (navbar.classList.contains('active')) {
                toggleMenu();
            }
        }

        /* Theme Management (System, Light, Dark) */
        function setTheme(mode) {
            localStorage.setItem('majstor_momo_theme', mode);

            document.body.classList.remove('light-theme', 'dark-theme');
            document.getElementById('btnThemeSystem').classList.remove('active');
            document.getElementById('btnThemeLight').classList.remove('active');
            document.getElementById('btnThemeDark').classList.remove('active');

            if (mode === 'light') {
                document.body.classList.add('light-theme');
                document.getElementById('btnThemeLight').classList.add('active');
            } else if (mode === 'dark') {
                document.body.classList.add('dark-theme');
                document.getElementById('btnThemeDark').classList.add('active');
            } else {
                document.getElementById('btnThemeSystem').classList.add('active');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('majstor_momo_lang') || 'mk';
            setLang(savedLang);

            const savedTheme = localStorage.getItem('majstor_momo_theme') || 'system';
            setTheme(savedTheme);
        });

        /* Slideshow Logic */
        let currentSlide = 0;
        const slidesContainer = document.getElementById('slidesContainer');
        const totalSlides = document.querySelectorAll('.slide').length;

        function changeSlide(direction) {
            currentSlide += direction;
            
            if (currentSlide < 0) {
                currentSlide = totalSlides - 1;
            } else if (currentSlide >= totalSlides) {
                currentSlide = 0;
            }
            
            slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
        }

        let autoScrollTimer = setInterval(() => {
            changeSlide(1);
        }, 3000);

        function userChangeSlide(direction) {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer);
                autoScrollTimer = null;
            }
            changeSlide(direction);
        }

        /* Mobile Touch / Swipe Handling */
        let touchStartX = 0;
        let touchEndX = 0;
        const slideshowSection = document.getElementById('slideshowSection');

        slideshowSection.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        slideshowSection.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const threshold = 40;
            if (touchStartX - touchEndX > threshold) {
                userChangeSlide(1);
            } else if (touchEndX - touchStartX > threshold) {
                userChangeSlide(-1);
            }
        }

        /* Controls Observer */
        const sliderControls = document.getElementById('sliderControls');
        const footer = document.getElementById('footer');

        let isSlideshowInView = false;
        let isFooterInView = false;

        function updateControlsVisibility() {
            if (isSlideshowInView && !isFooterInView) {
                sliderControls.classList.add('visible');
            } else {
                sliderControls.classList.remove('visible');
            }
        }

        const slideshowObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                isSlideshowInView = entry.isIntersecting;
                updateControlsVisibility();
            });
        }, { threshold: 0.15 });

        const footerObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                isFooterInView = entry.isIntersecting;
                updateControlsVisibility();
            });
        }, { threshold: 0.1 });

        slideshowObserver.observe(slideshowSection);
        footerObserver.observe(footer);
    </script>
</body>
</html>

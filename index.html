<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majstor MOMO</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./Majstor_MOMO.png">
    <style>
        /* CSS Variables for Light / Dark / System Theme */
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body.dark-theme {
            --bg-color: #121212;
            --text-color: #ffffff;
            --glass-bg: rgba(18, 18, 18, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body.light-theme {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            body:not(.light-theme):not(.dark-theme) {
                --bg-color: #121212;
                --text-color: #ffffff;
                --glass-bg: rgba(18, 18, 18, 0.85);
                --border-color: rgba(255, 255, 255, 0.1);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Top Bar Container */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            max-height: 70px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .navbar.active {
            max-height: 520px;
        }

        .navbar.active.lang-open {
            max-height: 600px;
        }

        .nav-header {
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            width: 100%;
        }

        .logo {
            height: 50px;
            width: auto;
            object-fit: contain;
            cursor: pointer;
            user-select: none;
        }

        /* Scaled Up Hamburger Icon */
        .hamburger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            z-index: 1001;
            position: relative;
            margin-right: -10px;
        }

        .line1, .line2 {
            width: 24px;
            height: 2.5px;
            background-color: var(--text-color);
            border-radius: 2px;
            position: absolute;
            transition: transform 0.3s ease;
        }

        .line1 {
            transform: translateY(-6px);
        }

        .line2 {
            transform: translateY(6px);
        }

        /* Direct morphing animation into X */
        .hamburger.active .line1 {
            transform: translateY(0) rotate(45deg);
        }

        .hamburger.active .line2 {
            transform: translateY(0) rotate(-45deg);
        }

        /* Inner Menu Content */
        .nav-content {
            padding: 10px 25px 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            color: var(--text-color);
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* Staggered Fade-In when Menu Opens */
        .navbar.active .nav-item {
            opacity: 1;
            transform: translateY(0);
        }

        .navbar.active .nav-item:nth-child(1) { transition-delay: 0.08s; }
        .navbar.active .nav-item:nth-child(2) { transition-delay: 0.12s; }
        .navbar.active .nav-item:nth-child(3) { transition-delay: 0.16s; }
        .navbar.active .nav-item:nth-child(4) { transition-delay: 0.20s; }
        .navbar.active .nav-item:nth-child(5) { transition-delay: 0.24s; }

        .lang-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-bottom: 8px;
        }

        .lang-toggle {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        /* Language Options Expansion */
        .lang-options {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 100%;
            padding-left: 36px;
            gap: 6px;
            transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, margin-top 0.3s ease;
            margin-top: 0;
        }

        .lang-options.active {
            max-height: 120px;
            opacity: 1;
            margin-top: 10px;
        }

        .lang-options div {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-color);
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .lang-options div:hover {
            background-color: var(--border-color);
        }

        /* Theme Toggle Controls */
        .theme-toggle-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            padding-top: 20px;
            padding-bottom: 10px;
            border-bottom: none;
        }

        .theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            transition: background 0.2s, border-color 0.2s;
        }

        .theme-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .theme-btn.active {
            background: var(--text-color);
            color: var(--bg-color);
            border-color: var(--text-color);
        }

        /* Computer / Phone System Icon Toggle */
        .icon-desktop {
            display: block;
        }
        .icon-mobile {
            display: none;
        }

        @media (max-width: 600px) {
            .icon-desktop {
                display: none;
            }
            .icon-mobile {
                display: block;
            }
        }

        /* Hero Section */
        .hero {
            margin-top: 70px;
            padding: 40px 20px;
            text-align: center;
        }

        .hero img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .hero h1 {
            margin-top: 25px;
            font-size: 24px;
            font-weight: 500;
        }

        /* Slideshow Section with Touch Support */
        .slideshow-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 40px auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            touch-action: pan-y;
        }

        .slides-container {
            display: flex;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
            user-select: none;
        }

        .slide {
            min-width: 100%;
            box-sizing: border-box;
        }

        .slide img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            pointer-events: none;
        }

        /* Bottom Fixed Slider Controls */
        .slider-controls {
            position: fixed;
            bottom: -80px; 
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            padding: 10px 25px;
            border-radius: 30px;
            display: flex;
            gap: 40px;
            z-index: 998;
            transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .slider-controls.visible {
            bottom: 30px;
        }

        .slider-controls button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.2s;
        }

        .slider-controls button:active {
            transform: scale(0.9);
        }

        /* Bottom Social Links & Action Buttons */
        .social-bottom {
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .social-bottom a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 18px;
            border: 1px solid var(--text-color);
            padding: 12px 30px;
            border-radius: 25px;
            width: 270px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.3s, color 0.3s;
        }

        .social-bottom a svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .social-bottom a.call-btn {
            background: var(--text-color);
            color: var(--bg-color);
            font-weight: 600;
        }

        .social-bottom a:hover {
            opacity: 0.85;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .hero h1 { font-size: 20px; }
        }
    </style>
</head>

    <!-- Footer -->
    <footer id="footer" data-key="footerText">
        ©2026 Мајстор МОМО Пехчево | Изработено со љубов од MilanovvDEV
    </footer>

    <!-- Fixed Slider Controls -->
    <div class="slider-controls" id="sliderControls">
        <button onclick="userChangeSlide(-1)">&#10094;</button>
        <button onclick="userChangeSlide(1)">&#10095;</button>
    </div>

    <!-- Scripts -->
    <script>
        const hamburger = document.getElementById('hamburger');
        const navbar = document.getElementById('navbar');
        const langOptions = document.getElementById('langOptions');

        function toggleMenu() {
            const isOpen = navbar.classList.contains('active');

            if (isOpen) {
                hamburger.classList.remove('active');
                navbar.classList.remove('active');
                navbar.classList.remove('lang-open');
                langOptions.classList.remove('active');
            } else {
                hamburger.classList.add('active');
                navbar.classList.add('active');
            }
        }

        function toggleLang() {
            langOptions.classList.toggle('active');
            navbar.classList.toggle('lang-open');
        }

        document.addEventListener('click', (event) => {
            const isClickInsideNavbar = navbar.contains(event.target);

            if (!isClickInsideNavbar && navbar.classList.contains('active')) {
                hamburger.classList.remove('active');
                navbar.classList.remove('active');
                navbar.classList.remove('lang-open');
                langOptions.classList.remove('active');
            }
        });

        /* Translations System */
        const translations = {
            en: {
                langLabel: "Language ▾",
                english: "English",
                macedonian: "Macedonian",
                welcome: "Welcome to Majstor MOMO! Discover more now.",
                call: "Call: +389 71 267 392",
                facebook: "Facebook",
                instagram: "Instagram",
                footerText: "©2026 Majstor MOMO Pehcevo | Made with love by MilanovvDEV"
            },
            mk: {
                langLabel: "Јазик ▾",
                english: "Англиски",
                macedonian: "Македонски",
                welcome: "Добредојдовте кај Мајстор МОМО! Откријте повеќе сега.",
                call: "Повикај: +389 71 267 392",
                facebook: "Facebook",
                instagram: "Instagram",
                footerText: "©2026 Мајстор МОМО Пехчево | Изработено со љубов од MilanovvDEV"
            }
        };

        function setLang(lang) {
            localStorage.setItem('majstor_momo_lang', lang);
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (translations[lang] && translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
            langOptions.classList.remove('active');
            navbar.classList.remove('lang-open');
            
            if (navbar.classList.contains('active')) {
                toggleMenu();
            }
        }

        /* Theme Management (System, Light, Dark) */
        function setTheme(mode) {
            localStorage.setItem('majstor_momo_theme', mode);

            document.body.classList.remove('light-theme', 'dark-theme');
            document.getElementById('btnThemeSystem').classList.remove('active');
            document.getElementById('btnThemeLight').classList.remove('active');
            document.getElementById('btnThemeDark').classList.remove('active');

            if (mode === 'light') {
                document.body.classList.add('light-theme');
                document.getElementById('btnThemeLight').classList.add('active');
            } else if (mode === 'dark') {
                document.body.classList.add('dark-theme');
                document.getElementById('btnThemeDark').classList.add('active');
            } else {
                document.getElementById('btnThemeSystem').classList.add('active');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('majstor_momo_lang') || 'mk';
            setLang(savedLang);

            const savedTheme = localStorage.getItem('majstor_momo_theme') || 'system';
            setTheme(savedTheme);
        });

        /* Slideshow Logic */
        let currentSlide = 0;
        const slidesContainer = document.getElementById('slidesContainer');
        const totalSlides = document.querySelectorAll('.slide').length;

        function changeSlide(direction) {
            currentSlide += direction;
            
            if (currentSlide < 0) {
                currentSlide = totalSlides - 1;
            } else if (currentSlide >= totalSlides) {
                currentSlide = 0;
            }
            
            slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
        }

        let autoScrollTimer = setInterval(() => {
            changeSlide(1);
        }, 3000);

        function userChangeSlide(direction) {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer);
                autoScrollTimer = null;
            }
            changeSlide(direction);
        }

        /* Mobile Touch / Swipe Handling */
        let touchStartX = 0;
        let touchEndX = 0;
        const slideshowSection = document.getElementById('slideshowSection');

        slideshowSection.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        slideshowSection.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const threshold = 40;
            if (touchStartX - touchEndX > threshold) {
                userChangeSlide(1);
            } else if (touchEndX - touchStartX > threshold) {
                userChangeSlide(-1);
            }
        }

        /* Controls Observer */
        const sliderControls = document.getElementById('sliderControls');
        const footer = document.getElementById('footer');

        let isSlideshowInView = false;
        let isFooterInView = false;

        function updateControlsVisibility() {
            if (isSlideshowInView && !isFooterInView) {
                sliderControls.classList.add('visible');
            } else {
                sliderControls.classList.remove('visible');
            }
        }

        const slideshowObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                isSlideshowInView = entry.isIntersecting;
                updateControlsVisibility();
            });
        }, { threshold: 0.15 });

        const footerObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                isFooterInView = entry.isIntersecting;
                updateControlsVisibility();
            });
        }, { threshold: 0.1 });

        slideshowObserver.observe(slideshowSection);
        footerObserver.observe(footer);
    </script>
</body>
